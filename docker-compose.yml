version: '3.8'

services:

  # ──────────────────────────────────────────
  # INFRAESTRUCTURA: Redis
  # ──────────────────────────────────────────
  redis-db:
    image: redis:alpine
    command: redis-server --maxmemory 50mb --maxmemory-policy volatile-lfu
    ports:
      - "6379:6379"
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # INFRAESTRUCTURA: Kafka (KRaft, sin Zookeeper)
  # ──────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      # Modo KRaft (sin Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Configuración general
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CLUSTER_ID: "kafka-tarea2-cluster-01"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sd-net

  # Inicializa los tópicos Kafka una sola vez al arrancar
  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo '>>> Creando tópicos Kafka...' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-retry --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-dlq --partitions 1 --replication-factor 1 &&
      echo '>>> Topicos creados:' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # SERVICIOS DE APLICACIÓN (Tarea 1, sin cambios)
  # ──────────────────────────────────────────
  sistema-cache:
    build: ./cache
    depends_on:
      - redis-db
    environment:
      - REDIS_HOST=redis-db
    networks:
      - sd-net

  generador-respuestas:
    build: ./respuestas
    volumes:
      - ./data:/app/data
    networks:
      - sd-net

  almacenamiento-metricas:
    build: ./metricas
    volumes:
      - ./data:/app/data
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # GENERADOR DE TRÁFICO
  # (en Tarea 1 llamaba directo a sistema-cache;
  #  en Tarea 2 publicará en Kafka — se actualiza en Commit 2)
  # ──────────────────────────────────────────
  generador-trafico:
    build: ./trafico
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      sistema-cache:
        condition: service_started
    environment:
      - KAFKA_BROKER=kafka:9092
      - MODO=sincrono   # "sincrono" usa flujo Tarea 1 | "kafka" usa flujo Tarea 2
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # CONSUMIDORES KAFKA (Tarea 2)
  # Escalables horizontalmente con --scale consumidor-kafka=N
  # ──────────────────────────────────────────
  consumidor-kafka:
    build: ./kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      sistema-cache:
        condition: service_started
      generador-respuestas:
        condition: service_started
      almacenamiento-metricas:
        condition: service_started
    environment:
      - KAFKA_BROKER=kafka:9092
      - CACHE_URL=http://sistema-cache:8000/consultar
      - RESPUESTAS_URL=http://generador-respuestas:5000/procesar
      - METRICAS_URL=http://almacenamiento-metricas:9000/registrar
      - MAX_RETRIES=3
      - RETRY_DELAY_MS=500
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # CONSUMIDOR DE REINTENTO KAFKA (Tarea 2)
  # Lee de consultas-retry y reintenta el procesamiento
  # ──────────────────────────────────────────
  consumidor-retry:
    build: ./kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      generador-respuestas:
        condition: service_started
      almacenamiento-metricas:
        condition: service_started
    environment:
      - KAFKA_BROKER=kafka:9092
      - CACHE_URL=http://sistema-cache:8000/consultar
      - RESPUESTAS_URL=http://generador-respuestas:5000/procesar
      - METRICAS_URL=http://almacenamiento-metricas:9000/registrar
      - MAX_RETRIES=3
      - RETRY_DELAY_MS=500
      - CONSUMER_MODE=retry
    networks:
      - sd-net

networks:
  sd-net:
    driver: bridge
version: '3.8'

services:

  # ──────────────────────────────────────────
  # INFRAESTRUCTURA: Redis
  # ──────────────────────────────────────────
  redis-db:
    image: redis:alpine
    command: redis-server --maxmemory 50mb --maxmemory-policy volatile-lfu
    ports:
      - "6379:6379"
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # INFRAESTRUCTURA: Kafka (KRaft, sin Zookeeper)
  # ──────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      # Modo KRaft (sin Zookeeper)
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Configuración de tópicos
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      # Retención de mensajes (24 horas)
      - KAFKA_CFG_LOG_RETENTION_HOURS=24
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - sd-net

  # Inicializa los tópicos Kafka una sola vez al arrancar
  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo '>>> Creando tópicos Kafka...'

      # Tópico principal de consultas (3 particiones → soporte para hasta 3 consumidores en paralelo)
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic consultas \
        --partitions 3 \
        --replication-factor 1

      # Tópico de reintento (1 partición, orden estricto de reintentos)
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic consultas-retry \
        --partitions 1 \
        --replication-factor 1

      # Dead Letter Queue (1 partición, destino final de consultas irrecuperables)
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
        --topic consultas-dlq \
        --partitions 1 \
        --replication-factor 1

      echo '>>> Tópicos creados:'
      kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # SERVICIOS DE APLICACIÓN (Tarea 1, sin cambios)
  # ──────────────────────────────────────────
  sistema-cache:
    build: ./cache
    depends_on:
      - redis-db
    environment:
      - REDIS_HOST=redis-db
    networks:
      - sd-net

  generador-respuestas:
    build: ./respuestas
    volumes:
      - ./data:/app/data
    networks:
      - sd-net

  almacenamiento-metricas:
    build: ./metricas
    volumes:
      - ./data:/app/data
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # GENERADOR DE TRÁFICO
  # (en Tarea 1 llamaba directo a sistema-cache;
  #  en Tarea 2 publicará en Kafka — se actualiza en Commit 2)
  # ──────────────────────────────────────────
  generador-trafico:
    build: ./trafico
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      sistema-cache:
        condition: service_started
    environment:
      - KAFKA_BROKER=kafka:9092
      - MODO=sincrono   # "sincrono" usa flujo Tarea 1 | "kafka" usa flujo Tarea 2
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # CONSUMIDORES KAFKA (Tarea 2)
  # Escalables horizontalmente con --scale consumidor-kafka=N
  # ──────────────────────────────────────────
  consumidor-kafka:
    build: ./kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      sistema-cache:
        condition: service_started
      generador-respuestas:
        condition: service_started
      almacenamiento-metricas:
        condition: service_started
    environment:
      - KAFKA_BROKER=kafka:9092
      - CACHE_URL=http://sistema-cache:8000/consultar
      - RESPUESTAS_URL=http://generador-respuestas:5000/procesar
      - METRICAS_URL=http://almacenamiento-metricas:9000/registrar
      - MAX_RETRIES=3          # Intentos máximos antes de enviar a DLQ
      - RETRY_DELAY_MS=500     # Espera base entre reintentos (ms)
    networks:
      - sd-net

  # ──────────────────────────────────────────
  # CONSUMIDOR DE REINTENTO KAFKA (Tarea 2)
  # Lee de consultas-retry y reintenta el procesamiento
  # ──────────────────────────────────────────
  consumidor-retry:
    build: ./kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      generador-respuestas:
        condition: service_started
      almacenamiento-metricas:
        condition: service_started
    environment:
      - KAFKA_BROKER=kafka:9092
      - CACHE_URL=http://sistema-cache:8000/consultar
      - RESPUESTAS_URL=http://generador-respuestas:5000/procesar
      - METRICAS_URL=http://almacenamiento-metricas:9000/registrar
      - MAX_RETRIES=3
      - RETRY_DELAY_MS=500
      - CONSUMER_MODE=retry    # Indica que este consumidor opera sobre el tópico de reintento
    networks:
      - sd-net

networks:
  sd-net:
    driver: bridge
